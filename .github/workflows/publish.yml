name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful master CI run containing the tested release-distributions artifact
        required: true
        type: string
      version:
        description: Exact package version to publish
        required: true
        default: 0.2.0a1
        type: string
      publish:
        description: Upload to PyPI (false validates and retains the candidate only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Require successful CI for a master push
        id: source
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.CI_RUN_ID)) {
              throw new Error('ci_run_id must be a positive integer');
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: process.env.CI_RUN_ID,
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (run.conclusion !== 'success' || run.status !== 'completed' ||
                run.event !== 'push' || run.head_branch !== 'master' ||
                run.head_repository.full_name !== repository ||
                run.path !== '.github/workflows/ci.yml') {
              throw new Error('Release requires completed, successful master push CI in this repository');
            }
            core.setOutput('sha', run.head_sha);
            await core.summary.addHeading('Release source')
              .addLink(run.head_sha, run.html_url).write();
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: release/dist
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install twine==6.2.0
      - run: python -m twine check --strict release/dist/*
      - name: Verify version and retain exact artifact hashes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          python - <<'PY'
          import email
          import hashlib
          import json
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          version = os.environ['RELEASE_VERSION']
          root = Path('release')
          files = sorted((root / 'dist').iterdir())
          expected = {f'gibbsiq-{version}-py3-none-any.whl', f'gibbsiq-{version}.tar.gz'}
          if {path.name for path in files} != expected:
              raise SystemExit('Expected exactly the requested Gibbsiq wheel and sdist')
          hashes = {}
          for path in files:
              if path.suffix == '.whl':
                  with zipfile.ZipFile(path) as archive:
                      metadata = archive.read(f'gibbsiq-{version}.dist-info/METADATA')
              else:
                  with tarfile.open(path) as archive:
                      metadata = archive.extractfile(f'gibbsiq-{version}/PKG-INFO').read()
              message = email.message_from_bytes(metadata)
              if message['Name'] != 'gibbsiq' or message['Version'] != version:
                  raise SystemExit('Distribution metadata does not match the requested release')
              hashes[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = dict(version=version, source_sha=os.environ['SOURCE_SHA'],
                          ci_run_id=os.environ['CI_RUN_ID'], sha256=hashes)
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: release/
          if-no-files-found: error
          retention-days: 90

  publish:
    if: inputs.publish
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/gibbsiq/${{ inputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: release
      - name: Publish the tested distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/dist/

  index-smoke:
    needs: [candidate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify PyPI bytes and install the exact released wheel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.request

          manifest = json.loads(Path('release/manifest.json').read_text())
          version = manifest['version']
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(f'https://pypi.org/pypi/gibbsiq/{version}/json', timeout=30) as response:
                      published = json.load(response)
                  actual = {entry['filename']: entry['digests']['sha256'] for entry in published['urls']}
                  if actual != manifest['sha256']:
                      raise ValueError('PyPI distributions differ from tested artifacts')
                  break
              except (OSError, ValueError):
                  if attempt == 5:
                      raise
                  time.sleep(10)
          wheel_hash = next(value for name, value in actual.items() if name.endswith('.whl'))
          check = Path('tools/check_installed_package.py').resolve()
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              requirement = root / 'release.txt'
              requirement.write_text(f'gibbsiq=={version} --hash=sha256:{wheel_hash}\n')
              subprocess.check_call([sys.executable, '-m', 'venv', str(root / 'env')])
              python = str(root / 'env/bin/python')
              subprocess.check_call([python, '-m', 'pip', 'install', '--isolated', '--no-cache-dir',
                                     '--index-url', 'https://pypi.org/simple', '--only-binary=:all:',
                                     '--no-deps', '--require-hashes', '-r', str(requirement)], cwd=root)
              subprocess.check_call([python, '-I', str(check)], cwd=root)
              subprocess.check_call([python, '-m', 'pip', 'check'], cwd=root)
          PY
