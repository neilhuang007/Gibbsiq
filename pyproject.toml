[project]
name = "gibbsiq"
dynamic = ["version"]
description = "Validate stochastic workloads with bounded execution, reproducible evidence and frozen policies"
readme = "README.md"
requires-python = ">=3.10"
# Gibbsiq remains MIT; the pinned Z1T traversal includes Apache-2.0 expressions.
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "src/gibbsiq/qualification/adapters/Z1T_LICENSE.txt"]
authors = [{ name = "Neil Huang", email = "neilhuang007@gmail.com" }]
keywords = [
    "qubo",
    "ising",
    "combinatorial-optimization",
    "gibbs-sampling",
    "mcmc-diagnostics",
    "optimization",
    "thrml",
    "thermodynamic-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
# Core has zero required runtime dependencies — everything ships in the stdlib.
dependencies = []

# Optional integrations are installed only when requested.
[project.optional-dependencies]
dimod = ["dimod>=0.12"]
thrml = ["thrml>=0.1.3"]
arviz = ["arviz>=0.21"]
networkx = ["networkx>=3.0"]
qualification = ["numpy>=1.26"]
dev = [
    "build>=1.2",
    "mypy>=1.16",
    "ruff>=0.12",
    "twine>=6.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Version is single-sourced from gibbsiq.__version__.
[tool.setuptools.dynamic]
version = { attr = "gibbsiq.__version__" }

# PEP 561: ship the py.typed marker so type checkers consume the annotations.
[tool.setuptools.package-data]
gibbsiq = ["py.typed", "data/evaluation/*.json", "data/qualification/*.md", "qualification/adapters/Z1T_LICENSE.txt"]

[project.scripts]
gibbsiq-evaluate = "gibbsiq.evaluation:main"
gibbsiq = "gibbsiq.qualification.cli:main"

[project.urls]
Homepage = "https://github.com/neilhuang007/Gibbsiq"
Repository = "https://github.com/neilhuang007/Gibbsiq"
Issues = "https://github.com/neilhuang007/Gibbsiq/issues"

[tool.ruff]
line-length = 110
src = ["src", "test_suite/tests", "tools"]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B905"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
check_untyped_defs = true
files = ["src/gibbsiq"]
ignore_missing_imports = true
mypy_path = "src"
# Numerical dependency stubs use Python 3.12 syntax; runtime supports 3.10+.
python_version = "3.12"
strict_equality = true
warn_unused_configs = true

# Optional backend imports are validated by integration tests.
[[tool.mypy.overrides]]
module = ["thrml", "thrml.*", "dimod", "dimod.*", "jax", "jax.*"]
follow_imports = "skip"
