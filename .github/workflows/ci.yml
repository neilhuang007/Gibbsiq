name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check Markdown math
        run: python tools/check_markdown_math.py
      - name: Run tests
        run: |
          export PYTHONPATH=src
          python -m unittest discover -s test_suite/tests
