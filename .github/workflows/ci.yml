name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check Markdown math
        run: python tools/check_markdown_math.py
      - name: Run tests
        run: |
          export PYTHONPATH=src
          python -m unittest discover -s test_suite/tests

  test-thrml:
    # Second job with the optional extras so the THRML end-to-end tests
    # (sampler -> benchmark bridge -> strict oracle) actually run in CI
    # instead of skipping.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install with dev extras
        run: pip install -e ".[dev]"
      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Run mypy
        run: mypy
      - name: Run tests
        run: python -m unittest discover -s test_suite/tests
