name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  build-distribution:
    name: Build release artifacts once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel from sdist
        run: |
          python -m pip install build
          python -m build
      - name: Retain exact distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  test:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dependency-free core tests
        run: python -S -m unittest discover -s test_suite/tests

  test-thrml:
    name: Pinned extras / Ubuntu / Python 3.13.5
    # Second job with the optional extras so the THRML end-to-end tests
    # (sampler -> benchmark bridge -> strict oracle) actually run in CI
    # instead of skipping.
    runs-on: ubuntu-latest
    needs: build-distribution
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Download exact distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Install tested numerical sources and the exact wheel
        run: |
          python -m pip install -r requirements/qualification-integration.txt
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise RuntimeError(f"expected exactly one wheel, found {len(wheels)}")
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--no-deps", str(wheels[0].resolve())]
          )
          PY
          python -m pip check
          python -m pip freeze
      - name: Check installed numerical adapters outside the checkout
        run: |
          check="$GITHUB_WORKSPACE/tools/qualification/check_installed_optional.py"
          cd "$RUNNER_TEMP"
          python -I "$check" --profile S03 --output installed-samplers
          python -I "$check" --profile S04 --output installed-model
      - name: Run full suite without skips
        run: |
          python - <<'PY'
          import io
          from pathlib import Path
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("test_suite/tests")
          if suite.countTestCases() == 0:
              raise RuntimeError("no tests discovered for extras profile")
          log = io.StringIO()
          result = unittest.TextTestRunner(stream=log, verbosity=2).run(suite)
          output = log.getvalue()
          print(output, end="")
          Path("test-results").mkdir(exist_ok=True)
          Path("test-results/unittest.log").write_text(output[-2_000_000:], encoding="utf-8")

          if result.skipped:
              print("\nSkipped tests are forbidden in the extras profile:", file=sys.stderr)
              for test, reason in result.skipped:
                  print(f"- {test.id()}: {reason}", file=sys.stderr)

          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          PY

      - name: Retain bounded test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: optional-test-logs
          path: test-results/*.log
          if-no-files-found: ignore
          retention-days: 7

  distribution:
    name: Distribution / ${{ matrix.os }} / Python 3.13
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: build-distribution
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download exact distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Install metadata validation tool
        run: python -m pip install twine
      - name: Validate distribution metadata
        shell: bash
        run: python -m twine check --strict dist/*
      - name: Smoke test the installed wheel
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise RuntimeError(f"expected exactly one wheel, found {len(wheels)}")

          smoke_environment = Path(".wheel-smoke").resolve()
          subprocess.check_call([sys.executable, "-m", "venv", str(smoke_environment)])
          smoke_python = smoke_environment / (
              "Scripts/python.exe" if os.name == "nt" else "bin/python"
          )
          child_environment = os.environ.copy()
          child_environment.pop("PYTHONPATH", None)
          child_environment.pop("PYTHONHOME", None)

          subprocess.check_call(
              [
                  str(smoke_python),
                  "-m",
                  "pip",
                  "install",
                  "--no-index",
                  "--no-deps",
                  str(wheels[0].resolve()),
              ],
              env=child_environment,
          )

          smoke_check = Path("tools/check_installed_package.py").resolve()
          with tempfile.TemporaryDirectory() as temporary_directory:
              subprocess.check_call(
                  [str(smoke_python), "-I", str(smoke_check)],
                  cwd=temporary_directory,
                  env=child_environment,
              )

          subprocess.check_call(
              [str(smoke_python), "-m", "pip", "check"],
              env=child_environment,
          )
          PY
