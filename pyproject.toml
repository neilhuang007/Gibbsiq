[project]
name = "gibbsiq"
dynamic = ["version"]
description = "THRML-native optimization infrastructure for QUBO and Ising models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Neil Huang", email = "neilhuang007@gmail.com" }]
keywords = [
    "qubo",
    "ising",
    "combinatorial-optimization",
    "gibbs-sampling",
    "mcmc-diagnostics",
    "optimization",
    "thrml",
    "thermodynamic-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
# Core has zero required runtime dependencies — everything ships in the stdlib.
dependencies = []

# Optional features. `dimod` is only needed for IsingModel.to_dimod() /
# SampleResult.to_dimod() and the dimod conformance tests (skipped when absent).
# `thrml` enables the THRMLSampler runtime; its tests skip when it is absent.
# `arviz` enables the diagnostics crosscheck tests; they skip when it is absent.
[project.optional-dependencies]
dimod = ["dimod>=0.12"]
thrml = ["thrml>=0.1.3"]
arviz = ["arviz>=0.21"]
dev = [
    "dimod>=0.12",
    "thrml>=0.1.3",
    "arviz>=0.21",
    "mypy>=1.16",
    "ruff>=0.12",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Version is single-sourced from gibbsiq.__version__.
[tool.setuptools.dynamic]
version = { attr = "gibbsiq.__version__" }

# PEP 561: ship the py.typed marker so type checkers consume the annotations.
[tool.setuptools.package-data]
gibbsiq = ["py.typed"]

[project.scripts]
gibbsiq-evaluate = "gibbsiq.evaluation:main"

[project.urls]
Homepage = "https://github.com/neilhuang007/Gibbsiq"
Repository = "https://github.com/neilhuang007/Gibbsiq"
Issues = "https://github.com/neilhuang007/Gibbsiq/issues"

[tool.ruff]
line-length = 110
src = ["src", "test_suite/tests", "tools"]
target-version = "py310"
# Vendored upstream test suites (dimod, arviz-stats) are cross-validation reference
# material, kept verbatim; do not lint or format them to our conventions.
extend-exclude = ["test_suite/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B905"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
check_untyped_defs = true
files = ["src/gibbsiq"]
ignore_missing_imports = true
mypy_path = "src"
python_version = "3.10"
strict_equality = true
warn_unused_configs = true

# Do not follow mypy into the optional numeric backends. src/gibbsiq imports
# thrml, jax (thrml_runtime.py) and dimod (model.py, result.py) only inside
# guarded functions, and each pulls in the numpy/jax scientific stack. A fresh CI
# ``pip install -e ".[dev]"`` resolves numpy to 2.5.x, whose stubs ship PEP 695
# ``type`` statements that mypy rejects under ``python_version = 3.10`` (a parse
# error that follow_imports=skip on numpy itself cannot suppress once the stub is
# reached — the skip must be applied at every importer that would reach numpy).
# gibbsiq guards these as optional Any-typed backends, so cutting the follow at
# each backend boundary keeps the 3.10 target for our own code while making the
# type-check reproducible against dependency drift.
[[tool.mypy.overrides]]
module = ["thrml", "thrml.*", "dimod", "dimod.*", "jax", "jax.*"]
follow_imports = "skip"
