name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dependency-free core tests
        run: python -S -m unittest discover -s test_suite/tests

  test-thrml:
    name: Extras / Ubuntu / Python 3.13
    # Second job with the optional extras so the THRML end-to-end tests
    # (sampler -> benchmark bridge -> strict oracle) actually run in CI
    # instead of skipping.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install with dev extras
        run: pip install -e ".[dev]"
      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Run mypy
        run: mypy
      - name: Run full suite without skips
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("test_suite/tests")
          if suite.countTestCases() == 0:
              raise RuntimeError("no tests discovered for extras profile")
          result = unittest.TextTestRunner(verbosity=2).run(suite)

          if result.skipped:
              print("\nSkipped tests are forbidden in the extras profile:", file=sys.stderr)
              for test, reason in result.skipped:
                  print(f"- {test.id()}: {reason}", file=sys.stderr)

          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          PY

  distribution:
    name: Distribution / ${{ matrix.os }} / Python 3.13
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel from sdist
        run: python -m build
      - name: Validate distribution metadata
        shell: bash
        run: python -m twine check --strict dist/*
      - name: Smoke test the installed wheel
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise RuntimeError(f"expected exactly one wheel, found {len(wheels)}")

          smoke_environment = Path(".wheel-smoke").resolve()
          subprocess.check_call([sys.executable, "-m", "venv", str(smoke_environment)])
          smoke_python = smoke_environment / (
              "Scripts/python.exe" if os.name == "nt" else "bin/python"
          )
          child_environment = os.environ.copy()
          child_environment.pop("PYTHONPATH", None)
          child_environment.pop("PYTHONHOME", None)

          subprocess.check_call(
              [
                  str(smoke_python),
                  "-m",
                  "pip",
                  "install",
                  "--no-index",
                  "--no-deps",
                  str(wheels[0].resolve()),
              ],
              env=child_environment,
          )

          smoke_check = Path("tools/check_installed_package.py").resolve()
          with tempfile.TemporaryDirectory() as temporary_directory:
              subprocess.check_call(
                  [str(smoke_python), "-I", str(smoke_check)],
                  cwd=temporary_directory,
                  env=child_environment,
              )

          subprocess.check_call(
              [str(smoke_python), "-m", "pip", "check"],
              env=child_environment,
          )
          PY
